<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Applications sent</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e3e6eb; --ok:#127a43; --okbg:#e3f5ea; --no:#b3261e; --nobg:#fbe9e7; --mid:#8a5a00; --midbg:#fdf1d6; --accent:#2f5bd8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2c3340; --ok:#5fd08f; --okbg:#173524; --no:#ff8a80; --nobg:#40201d; --mid:#f2c264; --midbg:#3b2f12; --accent:#8fb0ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:0 0 2px; } h2 { font-size:18px; margin:0 0 2px; }
  h3 { font-size:12px; margin:22px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  a { color:var(--accent); } .muted { color:var(--muted); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  select, input, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
  button { cursor:pointer; }
  #q { flex:1; min-width:220px; }
  .cols { display:grid; grid-template-columns:minmax(280px, 380px) 1fr; gap:16px; align-items:start; }
  @media (max-width:820px) { .cols { grid-template-columns:1fr; } #list { max-height:40vh !important; } }
  #list { background:var(--card); border:1px solid var(--line); border-radius:8px; max-height:82vh; overflow:auto; }
  .item { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .item.on { box-shadow:inset 3px 0 0 var(--accent); background:color-mix(in srgb, var(--accent) 9%, transparent); }
  .item .co { font-weight:600; } .item .when { float:right; font-size:12px; color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; white-space:nowrap; }
  .submitted { background:var(--okbg); color:var(--ok); } .dry { background:var(--midbg); color:var(--mid); } .bad { background:var(--nobg); color:var(--no); }
  #detail { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px 20px; min-height:200px; }
  .qa { border-top:1px solid var(--line); padding:10px 0; }
  .qa .q { font-weight:600; } .qa .a { white-space:pre-wrap; margin-top:3px; overflow-wrap:anywhere; }
  .qa .src { font-size:12px; color:var(--muted); } .warn { color:var(--mid); font-weight:600; }
  .links { display:flex; flex-wrap:wrap; gap:8px 18px; margin:10px 0 0; }
  pre { white-space:pre-wrap; font:13px/1.5 system-ui, sans-serif; margin:0; overflow-wrap:anywhere; }
  details summary { cursor:pointer; color:var(--accent); }
  #lock { max-width:360px; margin:18vh auto 0; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:22px; }
  #lock input, #lock button { width:100%; margin-top:10px; }
  #lock button { background:var(--accent); color:#fff; border-color:var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <form id="lock" hidden>
    <h1>Applications sent</h1>
    <div class="muted">Enter the password to open this page.</div>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button>Open</button>
    <div id="lockmsg" class="warn" style="margin-top:10px"></div>
  </form>
  <div id="app" hidden>
    <h1>Applications sent</h1>
    <div class="muted">Everything submitted on your behalf. Search by company, job title, or any words from a question or answer.
      <span id="built"></span> <a href="#" id="signout">Lock this page</a></div>
    <div class="bar">
      <input id="q" placeholder="Search company, title, or anything said on the form">
      <select id="status">
        <option value="submitted">Submitted</option>
        <option value="not_submitted">Tried but not submitted</option>
        <option value="dry_run">Dry runs (never sent)</option>
        <option value="">Everything</option>
      </select>
    </div>
    <div class="muted" id="count" style="margin-bottom:8px"></div>
    <div class="cols">
      <div id="list"></div>
      <div id="detail"><span class="muted">Pick an application on the left.</span></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = ts => ts ? new Date(ts).toLocaleString([], {year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '';
const pill = a => a.status === 'submitted' ? '<span class="pill submitted">submitted</span>'
  : a.mode === 'dry_run' ? '<span class="pill dry">dry run, not sent</span>'
  : `<span class="pill bad">${esc(a.status.replace(/_/g, ' '))}</span>`;
const SOURCE = {rule: 'from your profile', bank: 'stock answer', model: 'written by the model', cover: 'cover letter written for this job'};
const FILES = {resume: ['Resume that was attached (PDF)', 'application/pdf'], cover: ['Cover letter that was attached (PDF)', 'application/pdf'],
               form: ['Picture of the filled form', 'image/png'], after_submit: ['Page shown after submitting', 'image/png']};
const KIND = a => a.status === 'submitted' ? 'submitted' : a.mode === 'live' ? 'not_submitted' : 'dry_run';
const MAX_SHOWN = 400;
let key = null, all = [], apps = [], current = null, timer = null;

// Every data file is 12 bytes of nonce followed by AES-256-GCM ciphertext.
async function unseal(path, fresh) {
  const r = await fetch(path, fresh ? {cache: 'no-cache'} : {});
  if (!r.ok) throw new Error('not found: ' + path);
  const buf = new Uint8Array(await r.arrayBuffer());
  return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, key, buf.slice(12)));
}
async function unsealJson(path, fresh) {
  const bytes = await unseal(path, fresh);
  return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
const useKey = async raw => { key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']); };
const saved = { get: () => { try { return localStorage.getItem('key'); } catch { return null; } },
                set: v => { try { v ? localStorage.setItem('key', v) : localStorage.removeItem('key'); } catch {} } };

async function start() {
  const raw = saved.get();
  if (raw) {
    try { await useKey(Uint8Array.from(atob(raw), c => c.charCodeAt(0))); return await openApp(); } catch { saved.set(null); }
  }
  $('lock').hidden = false; $('pw').focus();
}

$('lock').addEventListener('submit', async e => {
  e.preventDefault();
  $('lockmsg').textContent = 'Opening…';
  try {
    const meta = await (await fetch('meta.json', {cache: 'no-cache'})).json();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveBits']);
    const raw = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', iterations: meta.iterations,
      salt: Uint8Array.from(meta.salt.match(/../g), h => parseInt(h, 16))}, base, 256));
    await useKey(raw);
    await openApp();
    saved.set(btoa(String.fromCharCode(...raw)));
  } catch (err) {
    $('lockmsg').textContent = err instanceof DOMException ? 'That password did not work.' : 'Could not load the page: ' + err.message;
  }
});
$('signout').addEventListener('click', e => { e.preventDefault(); saved.set(null); location.reload(); });

async function openApp() {  // not "open": that would replace window.open
  all = (await unsealJson('index.enc', true)).applications;
  for (const a of all) a.hay = [a.title, a.company, a.url, a.form_url, a.text].join(' ').toLowerCase();
  fetch('built.json', {cache: 'no-cache'}).then(r => r.json()).then(b => { $('built').textContent = 'Updated ' + when(b.built) + '.'; }).catch(() => {});
  $('lock').hidden = true; $('app').hidden = false;
  load();
}

function load() {
  const words = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean), status = $('status').value;
  const match = all.filter(a => (!status || KIND(a) === status) && words.every(w => a.hay.includes(w)));
  apps = match.slice(0, MAX_SHOWN);
  const c = {}; for (const a of all) c[KIND(a)] = (c[KIND(a)] || 0) + 1;
  $('count').textContent = `${match.length} shown${match.length > MAX_SHOWN ? ` (first ${MAX_SHOWN} listed)` : ''} · ${c.submitted || 0} submitted in total, ${c.not_submitted || 0} tried but not submitted, ${c.dry_run || 0} dry runs`;
  $('list').innerHTML = apps.length ? apps.map(a => `<div class="item${a.id === current ? ' on' : ''}" data-id="${a.id}">
      <span class="when">${esc(when(a.ts))}</span><div class="co">${esc(a.company)}</div>
      <div>${esc(a.title)}</div><div>${pill(a)} <span class="muted">${esc(a.source)}</span></div></div>`).join('')
    : '<div class="item muted">No applications match.</div>';
  if (apps.length && !apps.some(a => a.id === current)) show(apps[0].id);
}

async function show(id) {
  current = id;
  document.querySelectorAll('.item').forEach(e => e.classList.toggle('on', +e.dataset.id === id));
  const a = apps.find(x => x.id === id);
  let d;
  try { d = await unsealJson(`j/${id}.enc`, true); } catch { $('detail').innerHTML = '<span class="muted">This application has not been uploaded yet.</span>'; return; }
  if (current !== id) return;
  const qs = d.questions.filter(q => q.answer.length);
  const blank = d.questions.filter(q => !q.answer.length && q.label);
  $('detail').innerHTML = `
    <h2>${esc(a.title)}</h2>
    <div><strong>${esc(a.company)}</strong> · ${esc(a.locations)}${a.compensation ? ' · ' + esc(a.compensation) : ''}</div>
    <div style="margin-top:6px">${pill(a)} <span class="muted">${a.status === 'submitted' ? 'sent' : 'last run'} ${esc(when(a.ts))} · job #${a.id} · ${esc(a.source)}</span></div>
    ${a.note ? `<div class="warn" style="margin-top:6px">${esc(a.note)}</div>` : ''}
    <div class="links">
      ${d.files.map(f => `<a href="#" data-file="f/${id}/${f}.enc" data-type="${FILES[f][1]}">${FILES[f][0]}</a>`).join('')}
      <a href="${esc(a.url)}" target="_blank" rel="noopener">Original posting</a>
      <a href="${esc(a.form_url)}" target="_blank" rel="noopener">Application form</a>
    </div>
    ${d.summary ? `<h3>Summary line on the attached resume</h3><div>${esc(d.summary)}</div>` : ''}
    ${d.cover ? `<h3>Cover letter</h3><div style="white-space:pre-wrap">${esc(d.cover.text)}</div>` : ''}
    <h3>What was said on the form (${qs.length} answers)</h3>
    ${qs.map(q => `<div class="qa"><div class="q">${esc(q.label)}</div><div class="a">${esc(q.answer.join('\n'))}</div>
      <div class="src">${esc(SOURCE[q.source] || q.source)}${q.unsure ? ' · <span class="warn">guess</span>' : ''}${q.filled && q.filled !== 'ok' ? ' · <span class="warn">not entered: ' + esc(q.filled) + '</span>' : ''}</div></div>`).join('') || '<div class="muted">No answers recorded.</div>'}
    ${blank.length ? `<details style="margin-top:10px"><summary>${blank.length} optional questions left blank</summary><ul>${blank.map(q => `<li>${esc(q.label)}</li>`).join('')}</ul></details>` : ''}
    <h3>The posting, as it was when seen</h3>
    <details><summary>Show the full job description</summary><pre>${esc(d.description)}</pre></details>`;
}

// A PDF or picture is decrypted here and opened in a new tab. The tab is opened first, during the
// click, because browsers block a tab opened after waiting for a download.
$('detail').addEventListener('click', async e => {
  const link = e.target.closest('a[data-file]');
  if (!link) return;
  e.preventDefault();
  const tab = window.open('', '_blank');
  if (tab) { tab.document.write('<p style="font:14px system-ui">Opening…</p>'); tab.document.close(); }
  try {
    const url = URL.createObjectURL(new Blob([await unseal(link.dataset.file)], {type: link.dataset.type}));
    if (tab) tab.location.href = url; else location.href = url;
  } catch (err) {
    if (tab) tab.close();
    link.insertAdjacentHTML('afterend', ' <span class="warn">could not be opened</span>');
  }
});
$('list').addEventListener('click', e => { const it = e.target.closest('.item[data-id]'); if (it) show(+it.dataset.id); });
$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 150); });
$('status').addEventListener('change', load);
start();
</script>
</body>
</html>
